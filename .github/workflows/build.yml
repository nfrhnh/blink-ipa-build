name: build-blink-ipa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Blink release tag to build (e.g. v18.4.2)"
        required: true
        default: "v18.4.2"
      shim:
        description: "source = compile+inject SideloadFix.dylib, none = source patch only"
        required: true
        default: "source"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26.6.app /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26 image found; available:"; ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "Using $XCODE_APP"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "free disk:"; df -h /

      - name: Build unsigned IPA
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          TEAM_ID: ""
          BLINK_SHIM: ${{ inputs.shim }}
          BLINK_VERSION: ${{ inputs.version }}
        run: |
          case "$BLINK_VERSION" in
            v[0-9]*.[0-9]*) ;;
            *) echo "invalid version input: $BLINK_VERSION"; exit 1 ;;
          esac
          chmod +x ./build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --build --version "$BLINK_VERSION"

      - name: Collect output
        if: always()
        run: |
          ls -la dist/ 2>/dev/null || true
          ls -la build-output/ 2>/dev/null || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blink-unsigned-ipa-${{ inputs.shim }}
          path: dist/*.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-output/build.log
            build-output/**/*.log
          if-no-files-found: ignore
          retention-days: 14
